openapi: 3.0.3
info:
  title: API REFRICAZ - Ubicaciones
  description: |
    Servicio web del proyecto integrador (Servicios Web).
    Busca ubicaciones en México (OpenStreetMap / Nominatim) y permite
    guardarlas por usuario en Firestore (CRUD).
    Las rutas de `ubicaciones-guardadas` requieren el encabezado `X-User-Id`.
  version: 1.0.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: /
    description: Servidor que sirve esta documentación (Docker Compose)
  - url: http://localhost:8000
    description: Servidor local
tags:
  - name: Sistema
    description: Estado del servicio
  - name: Ubicaciones
    description: Búsqueda de ubicaciones (OpenStreetMap)
  - name: Ubicaciones guardadas
    description: CRUD de ubicaciones guardadas por usuario (Firestore)
paths:
  /:
    get:
      tags: [Sistema]
      summary: Health check
      responses:
        "200":
          description: Servicio en línea
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/ubicaciones/{criterio}:
    get:
      tags: [Ubicaciones]
      summary: Buscar una ubicación por criterio
      description: Consulta Nominatim (máx. 1 petición por segundo, con caché en memoria).
      parameters:
        - name: criterio
          in: path
          required: true
          description: Texto a buscar (mínimo 2 caracteres).
          schema:
            type: string
            minLength: 2
          example: Guadalajara
      responses:
        "200":
          description: Ubicación encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ubicacion"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "404":
          $ref: "#/components/responses/NoEncontrado"
        "502":
          description: No fue posible consultar el servicio externo de ubicaciones
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Límite temporal de consultas alcanzado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/ubicaciones-guardadas:
    get:
      tags: [Ubicaciones guardadas]
      summary: Listar las ubicaciones guardadas del usuario
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Lista de ubicaciones del usuario (más recientes primero)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  total:
                    type: integer
                    example: 1
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/UbicacionGuardada"
        "401":
          $ref: "#/components/responses/SinUsuario"
    post:
      tags: [Ubicaciones guardadas]
      summary: Guardar una ubicación
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UbicacionNueva"
      responses:
        "201":
          description: Ubicación guardada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaUbicacion"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/SinUsuario"
        "409":
          description: La ubicación ya estaba guardada por este usuario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: Cuerpo de la petición demasiado grande (máx. 100 KB)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/ubicaciones-guardadas/{id}:
    parameters:
      - $ref: "#/components/parameters/UserId"
      - name: id
        in: path
        required: true
        description: Id del documento (se devuelve al crear la ubicación).
        schema:
          type: string
    get:
      tags: [Ubicaciones guardadas]
      summary: Consultar una ubicación guardada por id
      responses:
        "200":
          description: Ubicación encontrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    $ref: "#/components/schemas/UbicacionGuardada"
        "401":
          $ref: "#/components/responses/SinUsuario"
        "404":
          $ref: "#/components/responses/NoEncontrado"
    patch:
      tags: [Ubicaciones guardadas]
      summary: Actualizar las notas de una ubicación guardada
      description: "`PUT` funciona igual que `PATCH` en esta API."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActualizarNotas"
      responses:
        "200":
          description: Ubicación actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaUbicacion"
        "400":
          $ref: "#/components/responses/SolicitudInvalida"
        "401":
          $ref: "#/components/responses/SinUsuario"
        "404":
          $ref: "#/components/responses/NoEncontrado"
    delete:
      tags: [Ubicaciones guardadas]
      summary: Eliminar una ubicación guardada
      responses:
        "200":
          description: Ubicación eliminada
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Ubicación eliminada correctamente.
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      eliminado:
                        type: boolean
                        example: true
        "401":
          $ref: "#/components/responses/SinUsuario"
        "404":
          $ref: "#/components/responses/NoEncontrado"
components:
  parameters:
    UserId:
      name: X-User-Id
      in: header
      required: true
      description: Identificador del usuario dueño de las ubicaciones (ej. demo-usuario).
      schema:
        type: string
      example: demo-usuario
  responses:
    SolicitudInvalida:
      description: Datos inválidos
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    SinUsuario:
      description: Falta el encabezado X-User-Id
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NoEncontrado:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Health:
      type: object
      properties:
        status:
          type: string
          example: online
        message:
          type: string
          example: Servidor REFRICAZ funcionando
        fase:
          type: integer
          example: 2
        server_time:
          type: string
          format: date-time
    Ubicacion:
      type: object
      properties:
        id:
          type: string
          example: relation-1234567
        nombre:
          type: string
          example: Guadalajara, Jalisco, México
        categoria:
          type: string
          example: city
        estado:
          type: string
          nullable: true
          example: Jalisco
        municipio:
          type: string
          nullable: true
          example: Guadalajara
        codigo_postal:
          type: string
          nullable: true
        latitud:
          type: number
          example: 20.6720375
        longitud:
          type: number
          example: -103.338396
        recurso_visual:
          type: string
          format: uri
        fuente:
          type: string
          example: OpenStreetMap
    UbicacionNueva:
      type: object
      required: [external_id, nombre, categoria, estado, municipio, latitud, longitud]
      properties:
        external_id:
          type: string
          description: Id de la ubicación en la fuente (también se acepta el campo `id`).
          example: relation-1234567
        nombre:
          type: string
          example: Guadalajara, Jalisco, México
        categoria:
          type: string
          example: city
        estado:
          type: string
          example: Jalisco
        municipio:
          type: string
          example: Guadalajara
        codigo_postal:
          type: string
          nullable: true
        latitud:
          type: number
          minimum: -90
          maximum: 90
          example: 20.6720375
        longitud:
          type: number
          minimum: -180
          maximum: 180
          example: -103.338396
        recurso_visual:
          type: string
          description: URL que debe comenzar con https://
          example: https://www.openstreetmap.org/?mlat=20.67&mlon=-103.33
        notas:
          type: string
          maxLength: 250
          example: Sucursal principal
    UbicacionGuardada:
      type: object
      properties:
        id:
          type: string
          description: Id del documento en Firestore
        usuario_id:
          type: string
          example: demo-usuario
        external_id:
          type: string
        nombre:
          type: string
        categoria:
          type: string
        estado:
          type: string
        municipio:
          type: string
        codigo_postal:
          type: string
          nullable: true
        latitud:
          type: number
        longitud:
          type: number
        recurso_visual:
          type: string
          nullable: true
        fuente:
          type: string
          example: OpenStreetMap
        notas:
          type: string
        fecha_creacion:
          type: string
          format: date-time
        fecha_actualizacion:
          type: string
          format: date-time
    ActualizarNotas:
      type: object
      required: [notas]
      properties:
        notas:
          type: string
          maxLength: 250
          example: Notas actualizadas
    RespuestaUbicacion:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Ubicación guardada correctamente.
        data:
          $ref: "#/components/schemas/UbicacionGuardada"
    Error:
      type: object
      properties:
        status:
          type: string
          example: error
        message:
          type: string
          example: Ruta no encontrada
