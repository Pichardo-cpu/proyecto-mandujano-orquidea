server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Ruta de la API backend, mismo origen para las peticiones del navegador.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /api-docs { return 301 /api-docs/; }
    location /api-docs/ { proxy_pass http://backend:3000; }
    location = /openapi.yaml { proxy_pass http://backend:3000; }
    location / {
        try_files $uri $uri/ =404;
    }
    error_page 404 /frontend-404.html;
    location = /frontend-404.html { internal; }
    location ~ /\. { deny all; }
}
