<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prueba API - REFRICAZ</title><style>body{font:16px Arial,sans-serif;max-width:720px;margin:50px auto;padding:20px;background:#f5f7fa;color:#173552}section{background:#fff;padding:25px;border-radius:12px;border:1px solid #dce3eb}button{background:#16486b;color:white;border:0;border-radius:6px;padding:12px;cursor:pointer}pre{white-space:pre-wrap;word-break:break-all}</style></head><body><section><h1>REFRICAZ — Comprobación de API</h1><p>Este frontend consulta un endpoint real del backend mediante Nginx y el emulador local de Firestore.</p><button id="probar">Probar GET /api/ubicaciones-guardadas</button><pre id="salida">Preparado para ejecutar la prueba.</pre></section><script>document.getElementById('probar').onclick=async()=>{const salida=document.getElementById('salida');try{const r=await fetch('/api/ubicaciones-guardadas',{headers:{'x-user-id':'equipo-practica-2'}});const d=await r.json();salida.textContent='HTTP '+r.status+'\n'+JSON.stringify(d,null,2)}catch(e){salida.textContent='ERROR: '+e.message}};</script></body></html>
